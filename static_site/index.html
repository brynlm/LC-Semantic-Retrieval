<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Retrieval Explorer</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --panel-alt: #1d2129;
    --border: #2a2f3a;
    --text: #e4e6eb;
    --text-dim: #9aa1ac;
    --accent: #5b9dff;
    --accent-dim: #2c4a75;
    --code-color: #ff9f5b;
    --tag-color: #6bcf8f;
    --easy: #4caf7d;
    --medium: #e0a83e;
    --hard: #e05a5a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 16px;
  }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 18px;
    margin: 0;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
  }
  header h1:hover { color: var(--accent); }
  .search-wrap { position: relative; flex: 1; min-width: 220px; max-width: 420px; }
  #search {
    width: 100%;
    padding: 7px 10px;
    background: var(--panel-alt);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 15px;
  }
  #search:focus { outline: none; border-color: var(--accent); }
  #suggestions {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: var(--panel-alt);
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-top: 4px;
    max-height: 260px;
    overflow-y: auto;
    z-index: 20;
    display: none;
  }
  #suggestions div {
    padding: 6px 10px;
    cursor: pointer;
    font-size: 15px;
  }
  #suggestions div:hover { background: var(--accent-dim); }

  .controls { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .control { display: flex; align-items: center; gap: 8px; }
  .control label { color: var(--text-dim); font-size: 14px; white-space: nowrap; }
  .control input[type=range] { width: 110px; }
  .control input[type=number] { width: 52px; background: var(--panel-alt); border: 1px solid var(--border); color: var(--text); border-radius: 4px; padding: 3px 5px; }
  .control .val { font-size: 14px; color: var(--text); min-width: 32px; }

  /* --- home view --- */
  #homeView { padding: 18px 20px; }
  #searchView { display: none; padding: 18px 20px; }
  #searchView h2 { margin: 0 0 14px 0; font-size: 20px; }
  #homeView h2 { margin: 0 0 4px 0; font-size: 20px; }
  #homeView .sub { color: var(--text-dim); font-size: 15px; margin-bottom: 16px; }
  #nameFilter {
    width: 100%;
    max-width: 420px;
    padding: 7px 10px;
    background: var(--panel-alt);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 15px;
    margin-bottom: 14px;
  }
  #nameFilter:focus { outline: none; border-color: var(--accent); }
  #tagCloud {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
    max-height: 140px;
    overflow-y: auto;
    padding: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .tag-toggle {
    cursor: pointer;
    background: var(--panel-alt);
    color: var(--text-dim);
    border: 1px solid var(--border);
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 14px;
    user-select: none;
  }
  .tag-toggle:hover { border-color: var(--accent); }
  .tag-toggle.active {
    background: rgba(91,157,255,.18);
    color: var(--accent);
    border-color: var(--accent);
  }
  #resultMeta { color: var(--text-dim); font-size: 14.5px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  #clearFilters { color: var(--accent); cursor: pointer; font-size: 14.5px; }
  #problemList { display: flex; flex-direction: column; gap: 6px; }
  .prow {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 7px;
    cursor: pointer;
  }
  .prow:hover { border-color: var(--accent); }
  .prow-name { font-weight: 600; font-size: 15.5px; flex-shrink: 0; }
  .prow-tags { display: flex; gap: 5px; flex-wrap: wrap; flex: 1; }
  .lc-link {
    color: var(--text-dim);
    text-decoration: none;
    font-size: 15px;
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 1px 6px;
    flex-shrink: 0;
  }
  .lc-link:hover { color: var(--accent); border-color: var(--accent); }
  .title-row { display: flex; align-items: center; gap: 8px; }

  /* --- problem view --- */
  #problemView { display: none; }
  #problemControls {
    padding: 8px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  main {
    display: grid;
    grid-template-columns: 420px 1fr;
    gap: 0;
    height: calc(100vh - 96px);
  }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; height: auto; }
  }

  #detail {
    border-right: 1px solid var(--border);
    padding: 18px 20px;
    overflow-y: auto;
  }
  #neighbors {
    padding: 18px 20px;
    overflow-y: auto;
  }
  h2.pname {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    word-break: break-word;
  }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    margin-right: 6px;
  }
  .badge.Easy { background: rgba(76,175,125,.18); color: var(--easy); }
  .badge.Medium { background: rgba(224,168,62,.18); color: var(--medium); }
  .badge.Hard { background: rgba(224,90,90,.18); color: var(--hard); }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 10px 0; }
  .chip {
    background: rgba(107,207,143,.13);
    color: var(--tag-color);
    padding: 2px 8px;
    border-radius: 9px;
    font-size: 13px;
  }
  .section-label {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--text-dim);
    margin: 16px 0 6px 0;
    font-weight: 600;
  }
  .mechanism-text { line-height: 1.55; color: var(--text); font-size: 15.5px; }
  .techniques { list-style: none; padding: 0; margin: 0; }
  .techniques li { margin-bottom: 8px; font-size: 15px; }
  .techniques .tname { color: var(--code-color); font-weight: 600; }
  .techniques .trole { color: var(--text-dim); }
  pre.code {
    background: var(--panel-alt);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 14px;
    overflow-x: auto;
    white-space: pre;
    max-height: 320px;
    overflow-y: auto;
  }
  details summary {
    cursor: pointer;
    color: var(--accent);
    font-size: 14.5px;
    margin: 4px 0;
  }

  .nb-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
  }
  .nb-header h3 { margin: 0; font-size: 15px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  .nb-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: border-color .12s;
  }
  .nb-card:hover { border-color: var(--accent); }
  .nb-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .nb-name { font-weight: 600; font-size: 16px; }
  .nb-rank { color: var(--text-dim); font-size: 14px; margin-right: 8px; }
  .score-bar-wrap { display: flex; align-items: center; gap: 6px; }
  .score-bar {
    width: 70px;
    height: 6px;
    background: var(--panel-alt);
    border-radius: 3px;
    overflow: hidden;
  }
  .score-bar .fill { height: 100%; background: var(--accent); }
  .score-num { font-size: 13px; color: var(--text-dim); min-width: 34px; }
  .nb-meta { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .sub-scores { display:flex; gap:14px; margin-top:6px; font-size:13px; color:var(--text-dim); }
  .empty-state { color: var(--text-dim); padding: 40px 0; text-align: center; }

  #promptPanel {
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  #promptBar { display: flex; gap: 10px; align-items: flex-start; }
  #promptInput {
    flex: 1;
    resize: vertical;
    min-height: 38px;
    background: var(--panel-alt);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    padding: 8px 10px;
  }
  #promptInput:disabled { opacity: .5; }
  #promptBtn {
    background: var(--accent);
    color: #0f1117;
    border: none;
    border-radius: 6px;
    padding: 0 16px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    height: 38px;
    white-space: nowrap;
  }
  #promptBtn:disabled { opacity: .4; cursor: not-allowed; }
  #searchStatus { margin-top: 8px; font-size: 14.5px; color: var(--text-dim); }
  #promptResults { margin-top: 0; }
  .rewritten-box {
    background: var(--panel-alt);
    border: 1px dashed var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 14.5px;
    color: var(--text-dim);
    margin-bottom: 12px;
    line-height: 1.5;
  }
  .rewritten-box .label { color: var(--accent); font-weight: 600; margin-right: 4px; }
  .prompt-cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 10px;
  }

  #loadingOverlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    color: var(--text-dim);
    font-size: 16px;
  }
</style>
</head>
<body>

<div id="loadingOverlay">Loading problem dataset…</div>

<header>
  <h1 id="homeLink">🔎 Retrieval Explorer</h1>
  <div class="search-wrap">
    <input id="search" placeholder="Jump to a problem (type to search)…" autocomplete="off">
    <div id="suggestions"></div>
  </div>
</header>

<div id="promptPanel">
  <div id="promptBar">
    <textarea id="promptInput" rows="2" placeholder="Describe the kind of problem or mechanism you're looking for… (e.g. &quot;two pointers closing in from both ends of a sorted array&quot;)"></textarea>
    <button id="promptBtn">Search by description</button>
  </div>
  <div id="searchStatus"></div>
</div>

<div id="homeView">
  <h2>Browse problems</h2>
  <div class="sub">Filter by tag and/or name, then pick a problem to explore its matches.</div>
  <input id="nameFilter" placeholder="Filter by name…">
  <div id="tagCloud"></div>
  <div id="resultMeta">
    <span id="resultCount"></span>
    <span id="clearFilters">Clear filters</span>
  </div>
  <div id="problemList"></div>
</div>

<div id="searchView">
  <h2>Search results</h2>
  <div id="promptResults"></div>
</div>

<div id="problemView">
  <div id="problemControls">
    <div class="controls">
      <div class="control">
        <label>Weight (tag ← → code-only)</label>
        <input type="range" id="alpha" min="0" max="1" step="0.05" value="0.7">
        <span class="val" id="alphaVal">0.70</span>
      </div>
      <div class="control">
        <label>K</label>
        <input type="number" id="k" min="1" max="60" value="12">
      </div>
    </div>
  </div>

  <main>
    <div id="detail"></div>
    <div id="neighbors"></div>
  </main>
</div>

<script>
const state = {
  current: null,
  k: 12,
  alpha: 0.7,
  activeTags: new Set(),
  nameFilterQuery: '',
  lastSearch: null, // { prompt, rewritten, degraded, results } from the most recent prompt search
};

let DATA = null;        // { tag_idf, problems }
let NAMES = [];         // problem names, index-aligned with DATA.problems
let NAME_TO_IDX = null; // Map name -> index into DATA.problems
let TAG_COUNTS = null;  // Map tag -> count of problems carrying it

const $ = (sel) => document.querySelector(sel);
const searchInput = $('#search');
const suggestionsBox = $('#suggestions');
const alphaSlider = $('#alpha');
const alphaVal = $('#alphaVal');
const kInput = $('#k');
const detailEl = $('#detail');
const neighborsEl = $('#neighbors');
const homeViewEl = $('#homeView');
const problemViewEl = $('#problemView');
const searchViewEl = $('#searchView');
const tagCloudEl = $('#tagCloud');
const nameFilterEl = $('#nameFilter');
const problemListEl = $('#problemList');
const resultCountEl = $('#resultCount');
const promptInput = $('#promptInput');
const promptBtn = $('#promptBtn');
const promptResultsEl = $('#promptResults');
const searchStatusEl = $('#searchStatus');

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function difficultyBadge(d) {
  return `<span class="badge ${escapeHtml(d)}">${escapeHtml(d)}</span>`;
}

// Display-only title-casing of a problem's URL slug -- e.g. "course-schedule-ii"
// -> "Course Schedule II". The raw slug (data.name / data-name attributes)
// is never touched by this; it's still what routing, lookups, and the
// LeetCode URL all use. This is a heuristic, not a perfect reconstruction of
// LeetCode's real title: a slug collapses both "this dash was a space" and
// "this dash was a real hyphen in the title" into the same character (e.g.
// "n-th-tribonacci-number" -> "N Th Tribonacci Number", not the real
// "N-th Tribonacci Number"), and acronyms LeetCode capitalizes fully (LRU,
// LFU, BST) aren't distinguishable from ordinary words in a lowercase slug.
// Roman-numeral sequel suffixes (very common in this corpus: II, III, IV...)
// are the one case worth handling explicitly, so "-ii" doesn't render as the
// word "Ii".
const TITLE_CASE_MINOR_WORDS = new Set([
  'a', 'an', 'the', 'and', 'but', 'or', 'nor', 'for', 'so', 'yet',
  'to', 'in', 'on', 'at', 'by', 'of', 'up', 'off', 'out', 'as', 'if', 'vs',
]);
const ROMAN_NUMERAL_RE = /^(i|ii|iii|iv|v|vi|vii|viii|ix|x)$/i;

function displayName(slug) {
  const words = slug.split('-');
  return words.map((w, i) => {
    if (ROMAN_NUMERAL_RE.test(w)) return w.toUpperCase();
    const lower = w.toLowerCase();
    if (i !== 0 && i !== words.length - 1 && TITLE_CASE_MINOR_WORDS.has(lower)) {
      return lower;
    }
    return lower.charAt(0).toUpperCase() + lower.slice(1);
  }).join(' ');
}

function leetcodeUrl(name) {
  return `https://leetcode.com/problems/${encodeURIComponent(name)}/`;
}

function leetcodeLink(name) {
  return `<a class="lc-link" href="${leetcodeUrl(name)}" target="_blank" rel="noopener noreferrer" title="Open on LeetCode">↗ LeetCode</a>`;
}

// --- client-side similarity math, mirroring categorical_similarity.py's
// IDF-weighted Dice (tags) and the plain dot product over pre-normalized
// embeddings (code-only) that retrieval_explorer_app.py computed server-side ---

function codeSim(embA, embB) {
  let dot = 0;
  for (let i = 0; i < embA.length; i++) dot += embA[i] * embB[i];
  return dot;
}

function tagSim(tagsA, tagsB) {
  const idf = DATA.tag_idf;
  const setA = new Set(tagsA);
  const setB = new Set(tagsB);
  let sumA = 0, sumB = 0, sumShared = 0;
  for (const t of setA) sumA += idf[t] || 0;
  for (const t of setB) sumB += idf[t] || 0;
  for (const t of setA) if (setB.has(t)) sumShared += idf[t] || 0;
  const denom = sumA + sumB;
  return denom ? (2 * sumShared) / denom : 0;
}

function computeNeighbors(idx, k, alpha) {
  const query = DATA.problems[idx];
  const scored = [];
  for (let i = 0; i < DATA.problems.length; i++) {
    if (i === idx) continue;
    const other = DATA.problems[i];
    const cs = codeSim(query.embedding, other.embedding);
    const ts = tagSim(query.tags, other.tags);
    scored.push({ idx: i, combined: alpha * cs + (1 - alpha) * ts, code: cs, tag: ts });
  }
  scored.sort((a, b) => b.combined - a.combined);
  return scored.slice(0, k);
}

// For a freshly-embedded free-text query vector, not an existing problem --
// pure code-only cosine similarity, no tag blend (a query has no tags of its
// own to compare), matching retrieval_explorer_app.py's /api/query design.
// queryVec must already be L2-normalized, same invariant as every embedding
// in DATA.problems.
function computeNeighborsForVector(queryVec, k) {
  const scored = [];
  for (let i = 0; i < DATA.problems.length; i++) {
    const other = DATA.problems[i];
    scored.push({ idx: i, score: codeSim(queryVec, other.embedding) });
  }
  scored.sort((a, b) => b.score - a.score);
  return scored.slice(0, k);
}

// --- prompt-based retrieval: LLM query rewrite (serverless function) ->
// client-side embedding (transformers.js) -> computeNeighborsForVector ---

const TRANSFORMERS_JS_VERSION = '2.17.2'; // pinned to match the parity check
// against the Python sentence-transformers embeddings (cosine sim ~0.99)

let embedPipelinePromise = null;
function getEmbedPipeline() {
  // load the library and the model lazily, only on first actual use, and
  // only once -- transformers.js caches the downloaded model weights in the
  // browser itself, so this only pays the ~25-30MB download cost the very
  // first time a visitor uses this feature.
  if (!embedPipelinePromise) {
    // the bare package specifier resolves to Node's CJS main entry, not a
    // browser-usable ES module -- dist/transformers.min.js is the actual
    // bundled ESM build (verified: ends in a webpack `export {...}` and
    // jsDelivr serves it as application/javascript).
    const libUrl = `https://cdn.jsdelivr.net/npm/@xenova/transformers@${TRANSFORMERS_JS_VERSION}/dist/transformers.min.js`;
    embedPipelinePromise = (async () => {
      let pipelineFn;
      try {
        const { pipeline, env } = await import(libUrl);
        // transformers.js defaults to checking a SAME-ORIGIN path
        // (env.localModelPath, "/models/" by default) for the model files
        // before ever trying Hugging Face's hub. Cloudflare Pages (and this
        // wrangler dev server) serve index.html with a 200 status for any
        // unmatched path (SPA-style fallback), so that same-origin probe
        // "succeeds" with our own HTML page instead of 404ing -- the library
        // never reaches its "not found locally, try remote" branch, and
        // tries to JSON.parse our index.html instead of the real tokenizer
        // file. Disabling local models entirely skips that same-origin
        // check and goes straight to the real Hugging Face URL.
        env.allowLocalModels = false;
        pipelineFn = pipeline;
        console.log('transformers.js loaded OK from', libUrl);
      } catch (e) {
        console.error('Failed to load transformers.js from', libUrl, e);
        throw e;
      }
      try {
        console.log('Loading Xenova/all-MiniLM-L6-v2 model (first use only, cached after)…');
        return await pipelineFn('feature-extraction', 'Xenova/all-MiniLM-L6-v2');
      } catch (e) {
        console.error('Failed to load the embedding model:', e);
        throw e;
      }
    })();
  }
  return embedPipelinePromise;
}

async function embedText(text) {
  const extractor = await getEmbedPipeline();
  const output = await extractor(text, { pooling: 'mean', normalize: true });
  return Array.from(output.data);
}

// Calls the serverless function that turns a free-text prompt into a
// paragraph written in the corpus's own mechanism-abstract register (see
// static_site/functions/api/rewrite.js). Returns null on ANY failure
// (network error, non-200, or the function's own "all models exhausted"
// signal) -- the caller treats null as the cue to fall back to embedding
// the user's raw prompt directly rather than surfacing an error.
async function rewriteQuery(prompt) {
  try {
    const res = await fetch('/api/rewrite', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt }),
    });
    if (!res.ok) return null;
    const data = await res.json();
    return data.rewritten || null;
  } catch {
    return null;
  }
}

// Renders state.lastSearch as its own page (#searchView), independent of
// whatever problem was being viewed before -- searching always takes you
// here, and clicking a result takes you into graph-walk mode for that
// problem specifically, not back to wherever you were.
function renderSearchView() {
  if (!state.lastSearch) {
    promptResultsEl.innerHTML = '<div class="empty-state">No search yet — type a description above and hit search.</div>';
    return;
  }
  const { degraded, results } = state.lastSearch;

  const cards = results.map(r => {
    const p = DATA.problems[r.idx];
    return `
    <div class="nb-card" data-name="${escapeHtml(p.name)}">
      <div class="nb-top">
        <span class="nb-name">${escapeHtml(displayName(p.name))}</span>
        ${scoreBar('similarity', r.score)}
      </div>
      <div class="nb-meta">
        ${difficultyBadge(p.difficulty)}
        ${(p.tags || []).slice(0, 8).map(t => `<span class="chip">${escapeHtml(t)}</span>`).join('')}
      </div>
    </div>`;
  }).join('');

  // Only shown in degraded mode (rewrite step unavailable) -- that's a
  // user-facing status worth knowing about. The rewritten text itself isn't
  // shown, same reasoning as dropping the mechanism abstracts: an internal
  // implementation detail, not something the user needs to see.
  const degradedNote = degraded
    ? `<div class="rewritten-box"><span class="label">Using your exact wording</span> — the rewrite step is temporarily unavailable, so this searched your prompt as-is.</div>`
    : '';

  promptResultsEl.innerHTML = `
    ${degradedNote}
    <div class="prompt-cards">${cards}</div>
  `;
  promptResultsEl.querySelectorAll('.nb-card').forEach(el => {
    el.addEventListener('click', () => goToProblem(el.dataset.name));
  });
}

async function runPromptSearch() {
  const prompt = promptInput.value.trim();
  if (!prompt) return;

  promptBtn.disabled = true;
  promptBtn.textContent = 'Rewriting…';
  searchStatusEl.textContent = 'Rewriting query…';

  try {
    const rewritten = await rewriteQuery(prompt);
    const degraded = rewritten === null;
    const textToEmbed = degraded ? prompt : rewritten;

    promptBtn.textContent = 'Loading embedding model…';
    searchStatusEl.textContent = 'Loading local embedding model (first use only)…';

    const queryVec = await embedText(textToEmbed);
    const results = computeNeighborsForVector(queryVec, state.k);
    state.lastSearch = { prompt, rewritten: textToEmbed, degraded, results };
    searchStatusEl.textContent = '';
    goToSearchResults();
  } catch (e) {
    console.error('Prompt search failed:', e);
    searchStatusEl.textContent = `Search failed: ${e.message}`;
  } finally {
    promptBtn.disabled = false;
    promptBtn.textContent = 'Search by description';
  }
}

promptBtn.addEventListener('click', runPromptSearch);
promptInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) runPromptSearch();
});

// dashes vs spaces shouldn't matter for matching -- titles now display with
// spaces (displayName), so typing "two sum" should find "two-sum" same as
// typing "two-sum" would.
function normalizeForSearch(s) {
  return s.toLowerCase().replace(/-/g, ' ');
}

function searchNames(q) {
  const lower = normalizeForSearch(q);
  const out = [];
  for (const n of NAMES) {
    if (normalizeForSearch(n).includes(lower)) {
      out.push(n);
      if (out.length >= 50) break;
    }
  }
  return out;
}

// --- routing: hash-based, so browser back/forward work natively instead
// of a custom breadcrumb trail. '#/problem/<name>' -> graph-walk view,
// anything else (including empty) -> home/browse view. ---

function navigate(hash) {
  if (location.hash === hash) { render(); return; }
  location.hash = hash;
}

function goToProblem(name) {
  if (!NAME_TO_IDX.has(name)) return;
  navigate('#/problem/' + encodeURIComponent(name));
}

function goHome() {
  navigate('');
}

function goToSearchResults() {
  navigate('#/search');
}

function currentRoute() {
  const hash = location.hash;
  if (hash.startsWith('#/problem/')) {
    return { view: 'problem', name: decodeURIComponent(hash.slice('#/problem/'.length)) };
  }
  if (hash === '#/search') {
    return { view: 'search' };
  }
  return { view: 'home' };
}

function render() {
  const route = currentRoute();
  homeViewEl.style.display = 'none';
  problemViewEl.style.display = 'none';
  searchViewEl.style.display = 'none';

  if (route.view === 'problem' && NAME_TO_IDX.has(route.name)) {
    problemViewEl.style.display = 'block';
    renderProblem(route.name);
  } else if (route.view === 'search') {
    searchViewEl.style.display = 'block';
    renderSearchView();
  } else {
    homeViewEl.style.display = 'block';
    renderHome();
  }
}

window.addEventListener('hashchange', render);
$('#homeLink').addEventListener('click', goHome);

// --- home view: tag cloud + name filter + problem list ---

function renderTagCloud() {
  const tags = Object.keys(TAG_COUNTS).sort();
  tagCloudEl.innerHTML = tags.map(t =>
    `<span class="tag-toggle${state.activeTags.has(t) ? ' active' : ''}" data-tag="${escapeHtml(t)}">${escapeHtml(t)} (${TAG_COUNTS[t]})</span>`
  ).join('');
  tagCloudEl.querySelectorAll('.tag-toggle').forEach(el => {
    el.addEventListener('click', () => {
      const tag = el.dataset.tag;
      if (state.activeTags.has(tag)) state.activeTags.delete(tag);
      else state.activeTags.add(tag);
      renderHome();
    });
  });
}

function filteredProblems() {
  const q = normalizeForSearch(state.nameFilterQuery);
  return DATA.problems.filter(p => {
    if (q && !normalizeForSearch(p.name).includes(q)) return false;
    for (const t of state.activeTags) {
      if (!p.tags.includes(t)) return false;
    }
    return true;
  });
}

function renderHome() {
  renderTagCloud();
  const results = filteredProblems();
  resultCountEl.textContent = `${results.length} of ${DATA.problems.length} problems`;
  problemListEl.innerHTML = results.map(p => `
    <div class="prow" data-name="${escapeHtml(p.name)}">
      <span class="prow-name">${escapeHtml(displayName(p.name))}</span>
      ${leetcodeLink(p.name)}
      ${difficultyBadge(p.difficulty)}
      <div class="prow-tags">${p.tags.map(t => `<span class="chip">${escapeHtml(t)}</span>`).join('')}</div>
    </div>
  `).join('');
  problemListEl.querySelectorAll('.prow').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('.lc-link')) return;
      goToProblem(el.dataset.name);
    });
  });
}

nameFilterEl.addEventListener('input', () => {
  state.nameFilterQuery = nameFilterEl.value.trim();
  renderHome();
});
$('#clearFilters').addEventListener('click', () => {
  state.activeTags.clear();
  state.nameFilterQuery = '';
  nameFilterEl.value = '';
  renderHome();
});

// --- problem view: detail + ranked neighbors ---

function renderProblem(name) {
  state.current = name;
  renderDetail(name);
  renderNeighbors(name);
}

function renderDetail(name) {
  const data = DATA.problems[NAME_TO_IDX.get(name)];
  const techniques = (data.techniques || []).map(t =>
    `<li><span class="tname">${escapeHtml(t.name)}</span> — <span class="trole">${escapeHtml(t.role)}</span></li>`
  ).join('');
  detailEl.innerHTML = `
    <div class="title-row">
      <h2 class="pname">${escapeHtml(displayName(data.name))}</h2>
      ${leetcodeLink(data.name)}
    </div>
    <div class="chips" style="margin-top:10px;">${difficultyBadge(data.difficulty)}${(data.tags || []).map(t => `<span class="chip">${escapeHtml(t)}</span>`).join('')}</div>
    ${techniques ? `<div class="section-label">Techniques</div><ul class="techniques">${techniques}</ul>` : ''}
    <details>
      <summary>Show code</summary>
      <pre class="code">${escapeHtml(data.code || '')}</pre>
    </details>
    <details>
      <summary>Show problem description</summary>
      <div class="mechanism-text" style="margin-top:8px;">${escapeHtml(data.description || '')}</div>
    </details>
  `;
}

function scoreBar(label, value) {
  const pct = Math.max(0, Math.min(100, value * 100));
  return `<div class="score-bar-wrap" title="${label}: ${value.toFixed(3)}">
    <div class="score-bar"><div class="fill" style="width:${pct}%"></div></div>
    <span class="score-num">${value.toFixed(2)}</span>
  </div>`;
}

function renderNeighbors(name) {
  const idx = NAME_TO_IDX.get(name);
  const list = computeNeighbors(idx, state.k, state.alpha);
  if (!list.length) {
    neighborsEl.innerHTML = '<div class="empty-state">No neighbors found.</div>';
    return;
  }
  const cards = list.map((n, i) => {
    const p = DATA.problems[n.idx];
    return `
    <div class="nb-card" data-name="${escapeHtml(p.name)}">
      <div class="nb-top">
        <div><span class="nb-rank">#${i + 1}</span><span class="nb-name">${escapeHtml(displayName(p.name))}</span></div>
        ${scoreBar('combined', n.combined)}
      </div>
      <div class="sub-scores">
        <span>code-only: ${n.code.toFixed(3)}</span>
        <span>tag: ${n.tag.toFixed(3)}</span>
        <span>${difficultyBadge(p.difficulty)}</span>
      </div>
      <div class="nb-meta">${(p.tags || []).slice(0, 8).map(t => `<span class="chip">${escapeHtml(t)}</span>`).join('')}</div>
    </div>
  `;
  }).join('');
  neighborsEl.innerHTML = `
    <div class="nb-header"><h3>Top ${list.length} matches</h3></div>
    ${cards}
  `;
  neighborsEl.querySelectorAll('.nb-card').forEach(el => {
    el.addEventListener('click', () => goToProblem(el.dataset.name));
  });
}

// --- global search / autocomplete (works from either view) ---
searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim();
  if (!q) { suggestionsBox.style.display = 'none'; return; }
  const names = searchNames(q);
  if (!names.length) { suggestionsBox.style.display = 'none'; return; }
  suggestionsBox.innerHTML = names.map(n => `<div data-name="${escapeHtml(n)}">${escapeHtml(displayName(n))}</div>`).join('');
  suggestionsBox.style.display = 'block';
  suggestionsBox.querySelectorAll('div').forEach(el => {
    el.addEventListener('click', () => {
      searchInput.value = '';
      suggestionsBox.style.display = 'none';
      goToProblem(el.dataset.name);
    });
  });
});
document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-wrap')) suggestionsBox.style.display = 'none';
});

// --- problem-view controls ---
alphaSlider.addEventListener('input', () => {
  state.alpha = parseFloat(alphaSlider.value);
  alphaVal.textContent = state.alpha.toFixed(2);
  if (state.current) renderNeighbors(state.current);
});
kInput.addEventListener('change', () => {
  let k = parseInt(kInput.value, 10);
  if (isNaN(k) || k < 1) k = 1;
  if (k > 60) k = 60;
  kInput.value = k;
  state.k = k;
  if (state.current) renderNeighbors(state.current);
});

// --- initial load: fetch the static dataset, compute tag counts, render ---
(async () => {
  let res;
  try {
    res = await fetch('data.json');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    DATA = await res.json();
  } catch (e) {
    document.getElementById('loadingOverlay').textContent =
      `Failed to load problem dataset (${e.message}). Try refreshing the page.`;
    return;
  }
  NAMES = DATA.problems.map(p => p.name);
  NAME_TO_IDX = new Map(NAMES.map((n, i) => [n, i]));

  TAG_COUNTS = {};
  for (const p of DATA.problems) {
    for (const t of p.tags) {
      TAG_COUNTS[t] = (TAG_COUNTS[t] || 0) + 1;
    }
  }

  document.getElementById('loadingOverlay').remove();
  render();
})();
</script>
</body>
